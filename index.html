<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>के हेरेको मुजी?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: system-ui, "Noto Sans Devanagari", sans-serif;
      background: #111;
    }

    .meme {
      width: 100vw;
      height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;

      background:
        radial-gradient(circle at 20% 20%, #ff006e 0%, transparent 25%),
        radial-gradient(circle at 80% 80%, #8338ec 0%, transparent 30%),
        linear-gradient(135deg, #111 0%, #050505 100%);

      position: relative;
      isolation: isolate;
    }

    /* Moving meme background */
    .meme::before,
    .meme::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      filter: blur(50px);
      opacity: 0.5;
      z-index: -1;
      animation: float 4s ease-in-out infinite alternate;
    }

    .meme::before {
      background: #ff006e;
      top: 5%;
      left: -40px;
    }

    .meme::after {
      background: #00f5d4;
      bottom: 5%;
      right: -40px;
      animation-delay: 1s;
    }

    .text {
      width: 100%;
      max-width: 600px;

      text-align: center;

      color: white;
      font-weight: 1000;

      font-size: clamp(3rem, 14vw, 7rem);
      line-height: 1.25;

      letter-spacing: -3px;

      text-shadow:
        5px 5px 0 #000,
        -3px -3px 0 #000,
        0 0 25px rgba(255,255,255,0.25);

      animation:
        pop 1.2s ease-in-out infinite alternate,
        wiggle 3s ease-in-out infinite;

      user-select: none;
      -webkit-user-select: none;
    }

    .text span {
      display: block;
    }

    .red {
      color: #ff3864;
    }

    .yellow {
      color: #ffe600;
    }

    .emoji {
      display: block;
      font-size: 0.45em;
      margin-top: 20px;
      animation: bounce 0.8s infinite alternate;
    }

    .hint {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;

      text-align: center;

      color: rgba(255,255,255,0.55);
      font-size: 12px;
      letter-spacing: 1px;
    }

    @keyframes pop {
      from {
        transform: scale(0.96) rotate(-1deg);
      }

      to {
        transform: scale(1.04) rotate(1deg);
      }
    }

    @keyframes wiggle {
      0%, 100% {
        filter: none;
      }

      50% {
        filter: drop-shadow(0 0 18px rgba(255,0,110,0.5));
      }
    }

    @keyframes bounce {
      from {
        transform: translateY(0) rotate(-8deg);
      }

      to {
        transform: translateY(-12px) rotate(8deg);
      }
    }

    @keyframes float {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(50px, -40px) scale(1.3);
      }
    }

    /* Screen shake */
    .shake {
      animation: screenShake 0.4s ease;
    }

    @keyframes screenShake {
      0%   { transform: translate(0); }
      20%  { transform: translate(-10px, 5px); }
      40%  { transform: translate(10px, -5px); }
      60%  { transform: translate(-7px, -3px); }
      80%  { transform: translate(7px, 3px); }
      100% { transform: translate(0); }
    }
  </style>
</head>
