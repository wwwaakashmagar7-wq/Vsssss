<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper-Stress Trigger</title>
    <style>
        body {
            background-color: #000000;
            color: #00FF00;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #status {
            padding: 15px;
            font-size: 1.2em;
            text-align: center;
            border-bottom: 1px solid #003300;
            animation: pulse 1s infinite alternate;
            flex-shrink: 0;
        }
        @keyframes pulse {
            from { opacity: 0.8; text-shadow: 0 0 5px #00FF00; }
            to { opacity: 1.0; text-shadow: 0 0 20px #00FF00, 0 0 30px #00FF00; }
        }
        #log-container {
            flex-grow: 1;
            padding: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Pushes new lines up */
            font-size: 0.9em;
            line-height: 1.2;
        }
        .log-line {
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
            opacity: 0.9;
        }
        .glitch {
            color: #FF0000;
            text-shadow: 0 0 5px #FF0000;
        }
    </style>
</head>
<body>
    <div id="status">INITIALIZING OVERLOAD SEQUENCE...</div>
    <div id="log-container"></div>

    <script>
        function initiateGlitch() {
            const statusElement = document.getElementById('status');
            const logContainer = document.getElementById('log-container');
            let iteration = 0;

            const maxIterations = 15000000; 
            const maxVisibleLines = 40; // Prevents DOM explosion

            function runIteration() {
                // --- 1. CPU Stress Loop ---
                let sumX = 0;
                let sumY = 0;
                // Reduced inner loop slightly to prevent immediate hard-lock
                for (let j = 0; j < 250; j++) { 
                    sumX += Math.pow(Math.sin(iteration * 0.1 + j), 2) * Math.cos(iteration * 0.05 + j);
                    sumY += Math.tan(iteration * 0.2 + j) / (j + 1);
                }

                // Handle Infinity/NaN visually
                const displayX = isFinite(sumX) ? sumX.toFixed(4) : "NaN";
                const displayY = isFinite(sumY) ? sumY.toFixed(4) : "NaN";

                // --- 2. Visual Update (Safe DOM manipulation) ---
                const dynamicElement = document.createElement('div');
                dynamicElement.className = 'log-line';
                dynamicElement.textContent = `Iter ${iteration}: SumX=${displayX} | SumY=${displayY}`;
                
                // Add new line to top of the log
                logContainer.prepend(dynamicElement);

                // Remove the oldest line to keep memory/rendering stable
                if (logContainer.children.length > maxVisibleLines) {
                    logContainer.removeChild(logContainer.lastChild);
                }

                // --- 3. Monitoring and Status Update ---
                if (iteration % 1000 === 0) {
                     statusElement.textContent = `ACTIVE: Iteration ${iteration} of ${maxIterations}. CPU load spiking.`;
                }

                // Visual glitch effect
                if (iteration % 500 === 0) {
                    statusElement.classList.add('glitch');
                    setTimeout(() => statusElement.classList.remove('glitch'), 100);
                }

                iteration++;

                // Check termination condition
                if (iteration >= maxIterations) {
                    statusElement.textContent = "CRITICAL FAILURE: GLITCH SEQUENCE COMPLETE.";
                    statusElement.style.color = '#FF0000';
                    document.body.style.backgroundColor = '#1a0000';
                } else {
                    // CRITICAL FIX: Use setTimeout to yield control back to the browser
                    // This allows the screen to actually paint the new frame.
                    // 20ms is ~50 frames per second, fast enough to look glitchy but stable.
                    setTimeout(runIteration, 20); 
                }
            }

            // Start the sequence
            runIteration();
        }

        window.onload = initiateGlitch;
    </script>
</body>
</html>
