<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>के हेरेको, मुजी?</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #000;
      font-family: Arial, sans-serif;
    }

    .screen {
      width: 100%;
      height: 100%;
      height: 100dvh;

      position: relative;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(
          circle at 20% 20%,
          #ff006e 0%,
          transparent 30%
        ),
        radial-gradient(
          circle at 80% 80%,
          #6c00ff 0%,
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #050505,
          #171717
        );

      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Background circles */

    .circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(35px);
      opacity: 0.6;
      pointer-events: none;
    }

    .circle.one {
      width: 180px;
      height: 180px;
      background: #ff006e;
      top: -50px;
      left: -50px;

      animation: moveOne 4s infinite alternate ease-in-out;
    }

    .circle.two {
      width: 220px;
      height: 220px;
      background: #00e5ff;
      bottom: -80px;
      right: -80px;

      animation: moveTwo 5s infinite alternate ease-in-out;
    }

    /* Main text */

    .content {
      width: 95%;
      text-align: center;
      position: relative;
      z-index: 5;

      animation: breathing 1.4s infinite alternate ease-in-out;
    }

    .line1,
    .line2 {
      display: block;

      font-weight: 900;

      /* Automatically scales for mobile */
      font-size: clamp(42px, 14vw, 120px);

      line-height: 1.2;

      letter-spacing: -2px;

      -webkit-text-stroke: 2px black;

      text-shadow:
        5px 5px 0 black,
        0 0 15px rgba(255,255,255,0.3);
    }

    .line1 {
      color: #ff315f;
    }

    .line2 {
      color: #ffe600;

      margin-top: 5px;
    }

    .emoji {
      display: block;

      font-size: clamp(35px, 12vw, 80px);

      margin-top: 15px;

      animation: emojiBounce 0.7s infinite alternate ease-in-out;
    }

    /* Small bottom text */

    .tap {
      position: absolute;

      bottom: 25px;
      left: 0;

      width: 100%;

      text-align: center;

      color: rgba(255,255,255,0.6);

      font-size: 12px;
      letter-spacing: 3px;

      z-index: 10;
    }

    /* Click shake */

    .shake {
      animation: shake 0.45s ease;
    }

    /* Animations */

    @keyframes breathing {
      from {
        transform: scale(0.96) rotate(-1deg);
      }

      to {
        transform: scale(1.04) rotate(1deg);
      }
    }

    @keyframes emojiBounce {
      from {
        transform: translateY(0) rotate(-8deg);
      }

      to {
        transform: translateY(-12px) rotate(8deg);
      }
    }

    @keyframes moveOne {
      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(80px, 100px);
      }
    }

    @keyframes moveTwo {
      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(-80px, -70px);
      }
    }

    @keyframes shake {
      0% {
        transform: translate(0);
      }

      15% {
        transform: translate(-15px, 8px) rotate(-1deg);
      }

      30% {
        transform: translate(15px, -8px) rotate(1deg);
      }

      45% {
        transform: translate(-12px, -5px);
      }

      60% {
        transform: translate(12px, 5px);
      }

      75% {
        transform: translate(-6px, 2px);
      }

      100% {
        transform: translate(0);
      }
    }
  </style>
</head>

<body>

  <div class="screen" id="screen">

    <!-- Animated background -->
    <div class="circle one"></div>
    <div class="circle two"></div>

    <!-- Meme -->
    <div class="content">

      <span class="line1">
        के हेरेको,
      </span>

      <span class="line2">
        मुजी?
      </span>

      <span class="emoji">
        💀😂
      </span>

    </div>

    <div class="tap">
      TAP THE SCREEN 💀
    </div>

  </div>

  <script>
    const screen = document.getElementById("screen");

    screen.addEventListener("click", function () {

      screen.classList.remove("shake");

      // Restart the animation
      void screen.offsetWidth;

      screen.classList.add("shake");

    });
  </script>

</body>
</html>
